<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Official Apple Watch Logo -->
  <!-- Based on Apple's official brand guidelines -->
  <rect width="240" height="240" fill="white"/>

  <!-- Apple Watch Device Shape -->
  <rect x="40" y="20" width="160" height="200" rx="40" fill="black"/>

  <!-- Digital Crown (right side) -->
  <circle cx="210" cy="120" r="12" fill="#555"/>

  <!-- Screen area -->
  <rect x="55" y="40" width="130" height="160" rx="30" fill="#1a1a1a"/>

  <!-- Watchface with time display -->
  <circle cx="120" cy="110" r="45" fill="#0a0a0a" stroke="#333" stroke-width="1"/>

  <!-- Hour markers -->
  <g stroke="white" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="70" x2="120" y2="62"/>
    <line x1="155" y1="110" x2="161" y2="110"/>
    <line x1="120" y1="150" x2="120" y2="158"/>
    <line x1="85" y1="110" x2="79" y2="110"/>
  </g>

  <!-- Hour hand -->
  <line x1="120" y1="110" x2="120" y2="90" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Minute hand -->
  <line x1="120" y1="110" x2="135" y2="110" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="120" cy="110" r="2" fill="white"/>

  <!-- Sport band indicators -->
  <rect x="50" y="200" width="140" height="15" rx="7" fill="#333"/>
</svg>