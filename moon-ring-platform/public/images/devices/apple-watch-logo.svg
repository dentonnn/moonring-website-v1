<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Apple Watch Icon -->
  <defs>
    <linearGradient id="appleWatchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Watch Body -->
  <rect x="40" y="30" width="120" height="140" rx="30" fill="url(#appleWatchGrad)" />

  <!-- Screen -->
  <rect x="50" y="45" width="100" height="110" rx="20" fill="#000000" />

  <!-- Screen Content - Digital Crown indicator -->
  <circle cx="170" cy="95" r="8" fill="#555555" />

  <!-- Watch Face Details -->
  <circle cx="100" cy="95" r="35" fill="#111111" stroke="#444444" stroke-width="2" />

  <!-- Time indicators -->
  <line x1="100" y1="65" x2="100" y2="55" stroke="#FFFFFF" stroke-width="2" />
  <line x1="115" y1="80" x2="122" y2="73" stroke="#FFFFFF" stroke-width="2" />
  <line x1="130" y1="95" x2="140" y2="95" stroke="#FFFFFF" stroke-width="2" />

  <!-- Center dot -->
  <circle cx="100" cy="95" r="3" fill="#FFFFFF" />
</svg>