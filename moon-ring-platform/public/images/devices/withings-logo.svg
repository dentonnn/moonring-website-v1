<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Withings Logo -->
  <defs>
    <linearGradient id="withingsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003DB5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Device Body - rounded rectangle -->
  <rect x="40" y="50" width="120" height="80" rx="20" fill="url(#withingsGrad)" />

  <!-- Screen -->
  <rect x="55" y="65" width="90" height="50" rx="8" fill="#000033" />

  <!-- Graph pattern - health metrics display -->
  <g fill="#00FF99" opacity="0.8">
    <!-- Bar chart -->
    <rect x="65" y="95" width="6" height="12" rx="1" />
    <rect x="75" y="85" width="6" height="22" rx="1" />
    <rect x="85" y="88" width="6" height="19" rx="1" />
    <rect x="95" y="92" width="6" height="15" rx="1" />
    <rect x="105" y="80" width="6" height="27" rx="1" />
  </g>

  <!-- Withings logo text representation -->
  <text x="100" y="135" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle" opacity="0.7">W</text>
</svg>