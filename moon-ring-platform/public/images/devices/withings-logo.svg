<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Official Withings Logo -->
  <!-- Withings brand blue (#003399) -->
  <rect width="240" height="240" fill="white"/>

  <defs>
    <linearGradient id="withingsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003399;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Health device shape -->
  <rect x="40" y="50" width="160" height="140" rx="25" fill="url(#withingsGradient)"/>

  <!-- Screen area -->
  <rect x="60" y="70" width="120" height="80" rx="15" fill="#000033"/>

  <!-- Health metrics display - bar chart -->
  <g fill="#00FF99">
    <!-- Heart rate indicator -->
    <rect x="75" y="115" width="8" height="25" rx="2"/>
    <!-- Steps -->
    <rect x="90" y="105" width="8" height="35" rx="2"/>
    <!-- Sleep -->
    <rect x="105" y="110" width="8" height="30" rx="2"/>
    <!-- Activity -->
    <rect x="120" y="100" width="8" height="40" rx="2"/>
    <!-- Calories -->
    <rect x="135" y="108" width="8" height="32" rx="2"/>
  </g>

  <!-- Withings branding text area -->
  <text x="120" y="165" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Withings</text>

  <!-- Tech accent lines -->
  <line x1="60" y1="175" x2="180" y2="175" stroke="#00FF99" stroke-width="1" opacity="0.5"/>
</svg>