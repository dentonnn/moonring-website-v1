<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fitbit Logo -->
  <defs>
    <linearGradient id="fitbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B822D3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9B1B9F;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fitbit Band -->
  <rect x="35" y="40" width="130" height="100" rx="15" fill="url(#fitbitGrad)" />

  <!-- Screen area -->
  <rect x="50" y="60" width="100" height="60" rx="8" fill="#000000" opacity="0.9" />

  <!-- Screen display - dots pattern -->
  <g fill="#FFFFFF" opacity="0.8">
    <!-- Top row -->
    <rect x="60" y="70" width="6" height="6" rx="1" />
    <rect x="72" y="70" width="6" height="6" rx="1" />
    <rect x="84" y="70" width="6" height="6" rx="1" />
    <rect x="96" y="70" width="6" height="6" rx="1" />
    <rect x="108" y="70" width="6" height="6" rx="1" />

    <!-- Middle row -->
    <rect x="60" y="85" width="6" height="6" rx="1" />
    <rect x="72" y="85" width="6" height="6" rx="1" />
    <rect x="84" y="85" width="6" height="6" rx="1" />
    <rect x="96" y="85" width="6" height="6" rx="1" />
    <rect x="108" y="85" width="6" height="6" rx="1" />

    <!-- Bottom row -->
    <rect x="60" y="100" width="6" height="6" rx="1" />
    <rect x="72" y="100" width="6" height="6" rx="1" />
    <rect x="84" y="100" width="6" height="6" rx="1" />
    <rect x="96" y="100" width="6" height="6" rx="1" />
    <rect x="108" y="100" width="6" height="6" rx="1" />
  </g>
</svg>