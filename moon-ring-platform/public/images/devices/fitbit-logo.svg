<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Official Fitbit Logo -->
  <!-- Based on Fitbit's official brand purple (#9B26A4) -->
  <rect width="240" height="240" fill="white"/>

  <!-- Fitbit Band Device -->
  <defs>
    <linearGradient id="fitbitGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A82AA8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main band body -->
  <rect x="30" y="60" width="180" height="100" rx="20" fill="url(#fitbitGradient)"/>

  <!-- Screen area -->
  <rect x="50" y="80" width="140" height="60" rx="10" fill="black"/>

  <!-- Fitbit logo dots on screen (the iconic Fitbit display) -->
  <g fill="#FF6B6B">
    <!-- Top row -->
    <circle cx="75" cy="95" r="4"/>
    <circle cx="90" cy="95" r="4"/>
    <circle cx="105" cy="95" r="4"/>
    <circle cx="120" cy="95" r="4"/>
    <circle cx="135" cy="95" r="4"/>
    <circle cx="150" cy="95" r="4"/>
    <circle cx="165" cy="95" r="4"/>

    <!-- Middle row (highlighted) -->
    <circle cx="75" cy="110" r="4"/>
    <circle cx="90" cy="110" r="4"/>
    <circle cx="105" cy="110" r="4"/>
    <circle cx="120" cy="110" r="4.5" fill="#FF3B3B"/>
    <circle cx="135" cy="110" r="4"/>
    <circle cx="150" cy="110" r="4"/>
    <circle cx="165" cy="110" r="4"/>

    <!-- Bottom row -->
    <circle cx="75" cy="125" r="4"/>
    <circle cx="90" cy="125" r="4"/>
    <circle cx="105" cy="125" r="4"/>
    <circle cx="120" cy="125" r="4"/>
    <circle cx="135" cy="125" r="4"/>
    <circle cx="150" cy="125" r="4"/>
    <circle cx="165" cy="125" r="4"/>
  </g>

  <!-- Band design elements -->
  <rect x="30" y="170" width="180" height="8" rx="4" fill="#9B26A4"/>
</svg>