<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Garmin Logo -->
  <defs>
    <linearGradient id="garminGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Watch Face Circle -->
  <circle cx="100" cy="100" r="65" fill="url(#garminGrad)" />

  <!-- Inner dial -->
  <circle cx="100" cy="100" r="55" fill="#000033" />

  <!-- Garmin "G" Logo -->
  <path d="M 85 95 Q 85 85 100 85 Q 115 85 115 100 Q 115 110 105 115 L 105 110 Q 112 107 112 100 Q 112 90 100 90 Q 90 90 90 100 Q 90 105 95 108 L 95 113 Q 86 110 85 100" fill="#FFFFFF" />

  <!-- GPS satellites indicator -->
  <g fill="#00FF99" opacity="0.7">
    <circle cx="135" cy="70" r="3" />
    <circle cx="145" cy="80" r="3" />
    <circle cx="140" cy="65" r="2" />
  </g>
</svg>