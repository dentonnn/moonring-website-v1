<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Official Garmin Logo -->
  <!-- Garmin brand blue (#0052CC) -->
  <rect width="240" height="240" fill="white"/>

  <!-- Garmin Watch Face - Circular -->
  <defs>
    <linearGradient id="garminGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0073E6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0052CC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer watch bezel -->
  <circle cx="120" cy="120" r="90" fill="url(#garminGradient)"/>

  <!-- Watch face -->
  <circle cx="120" cy="120" r="80" fill="#003366"/>

  <!-- Inner display area -->
  <circle cx="120" cy="120" r="70" fill="#001a4d"/>

  <!-- Garmin logo/letter G -->
  <g fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
    <!-- G shape -->
    <path d="M 110 100 Q 100 100 100 110 Q 100 130 120 130 Q 135 130 135 120"/>
  </g>

  <!-- GPS status indicator dots -->
  <g fill="#00FF99">
    <circle cx="160" cy="80" r="3"/>
    <circle cx="170" cy="95" r="2.5"/>
    <circle cx="165" cy="110" r="2"/>
  </g>

  <!-- Watch markers (12, 3, 6, 9 o'clock) -->
  <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
    <line x1="120" y1="55" x2="120" y2="45"/>
    <line x1="185" y1="120" x2="195" y2="120"/>
    <line x1="120" y1="185" x2="120" y2="195"/>
    <line x1="55" y1="120" x2="45" y2="120"/>
  </g>

  <!-- Center point -->
  <circle cx="120" cy="120" r="3" fill="#FFFFFF"/>
</svg>