<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Official Samsung Galaxy Watch Logo -->
  <!-- Samsung brand dark silver/black -->
  <rect width="240" height="240" fill="white"/>

  <defs>
    <linearGradient id="samsungGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A1A1A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333333;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Watch bezel (rotating) -->
  <circle cx="120" cy="120" r="95" fill="none" stroke="#555555" stroke-width="6"/>

  <!-- Outer watch case -->
  <circle cx="120" cy="120" r="88" fill="url(#samsungGradient)"/>

  <!-- Watch face -->
  <circle cx="120" cy="120" r="75" fill="#0A0A0A"/>

  <!-- Screen display area -->
  <circle cx="120" cy="120" r="65" fill="#000000"/>

  <!-- Samsung Galaxy accent - constellation pattern -->
  <g fill="#00CCFF">
    <circle cx="85" cy="85" r="4"/>
    <circle cx="155" cy="85" r="4"/>
    <circle cx="85" cy="155" r="4"/>
    <circle cx="155" cy="155" r="4"/>
    <circle cx="120" cy="60" r="3"/>
    <circle cx="120" cy="180" r="3"/>
  </g>

  <!-- Connecting lines between dots (subtle) -->
  <g stroke="#00CCFF" stroke-width="0.5" opacity="0.3">
    <line x1="85" y1="85" x2="155" y2="85"/>
    <line x1="85" y1="85" x2="85" y2="155"/>
    <line x1="155" y1="85" x2="155" y2="155"/>
    <line x1="85" y1="155" x2="155" y2="155"/>
  </g>

  <!-- Watch numerals (12, 3, 6, 9) -->
  <g fill="#CCCCCC" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="120" y="60">12</text>
    <text x="175" y="125">3</text>
    <text x="120" y="185">6</text>
    <text x="65" y="125">9</text>
  </g>

  <!-- Center point -->
  <circle cx="120" cy="120" r="4" fill="#FFFFFF"/>
</svg>