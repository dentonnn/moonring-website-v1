<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Oura Ring Logo -->
  <defs>
    <linearGradient id="ouraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9900;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC6600;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="url(#ouraGrad)" stroke-width="8" />

  <!-- Middle Ring -->
  <circle cx="100" cy="100" r="45" fill="none" stroke="url(#ouraGrad)" stroke-width="6" opacity="0.7" />

  <!-- Inner Core -->
  <circle cx="100" cy="100" r="25" fill="url(#ouraGrad)" />

  <!-- Inner glow effect -->
  <circle cx="100" cy="100" r="20" fill="#FFFFFF" opacity="0.3" />

  <!-- Center dot -->
  <circle cx="100" cy="100" r="8" fill="#FFFFFF" opacity="0.8" />

  <!-- Accent dots around -->
  <circle cx="100" cy="50" r="4" fill="#FFFFFF" opacity="0.6" />
  <circle cx="135" cy="135" r="4" fill="#FFFFFF" opacity="0.6" />
  <circle cx="65" cy="135" r="4" fill="#FFFFFF" opacity="0.6" />
</svg>